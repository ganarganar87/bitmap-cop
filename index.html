<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BITMAP COP — Bitcoin City Patrol</title><style>*{box-sizing:border-box}body{margin:0;background:#080e1b;color:#e8f4ff;font:14px system-ui,Arial;overflow:hidden}#hud{position:absolute;z-index:3;top:14px;left:14px;max-width:390px;background:#0a1425e8;border:1px solid #4d789a;padding:15px;border-radius:12px;box-shadow:0 8px 30px #0008}h1{font-size:22px;margin:0 0 5px;color:#69eaff;letter-spacing:2px}.muted{color:#a4b7c9;font-size:12px}input{background:#13243c;border:1px solid #5d8eae;color:white;padding:9px;border-radius:6px;width:150px}button{background:#12b7d4;color:#041321;border:0;border-radius:6px;padding:10px 12px;font-weight:800;cursor:pointer}button:hover{background:#79e6f7}#stats{margin-top:10px;line-height:1.8}#help{position:absolute;bottom:12px;left:12px;z-index:3;background:#08121ddc;padding:10px;border-radius:8px;font-size:12px}#banner{position:absolute;top:15px;right:15px;z-index:3;background:#142536dc;padding:12px;border:1px solid #3d7896;border-radius:8px;max-width:340px}#cross{position:absolute;left:50%;top:50%;color:#fff8;pointer-events:none}#touch{position:absolute;bottom:12px;right:12px;display:none;z-index:5;gap:5px}#touch button{min-width:48px;min-height:44px}canvas{display:block}@media(max-width:750px){#hud{top:5px;left:5px;padding:9px;max-width:calc(100vw - 10px)}#banner{top:170px;right:5px;font-size:11px;max-width:200px}#help{bottom:130px;max-width:240px}#touch{display:grid;grid-template-columns:repeat(3,1fr)}} </style></head><body><div id="hud"><h1>BITMAP COP <small style="font-size:10px;color:#f8c85b">ALPHA 1.0</small></h1><div class="muted">Patrulla de ciudades construidas desde Bitcoin</div><div style="margin-top:10px"><input id="block" value="800000.bitmap" aria-label="Número de bloque Bitmap"><button id="load">EXPLORAR</button></div><div id="stats">Preparando motor…</div></div><div id="banner">Cargando…</div><div id="help">WASD / flechas: mover · Ratón: apuntar · Clic / Espacio: disparar · T: transformar · R: reiniciar misión<br>Destruye los drones rojos. Los edificios reflejan transacciones reales.</div><div id="touch"><span></span><button data-key="ArrowUp">▲</button><button data-action="fire">●</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-action="transform">T</button></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
const $=id=>document.getElementById(id), scene=new THREE.Scene();scene.background=new THREE.Color(0x101c2c);scene.fog=new THREE.Fog(0x101c2c,65,165);
const camera=new THREE.PerspectiveCamera(53,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb6dcff,0x192535,2.2));const sun=new THREE.DirectionalLight(0xffd6a1,2);sun.position.set(25,50,30);scene.add(sun);
const mat=(color,emissive=0)=>new THREE.MeshStandardMaterial({color,roughness:.75,metalness:.18,emissive});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),mat(0x172a32));ground.rotation.x=-Math.PI/2;ground.position.y=-.06;scene.add(ground);
const city=new THREE.Group();scene.add(city);const enemies=[],shots=[],keys=new Set();let walls=[],player,body,vehicle=false,life=100,kills=0,world=null,loaded=false,shootCD=0,enemySpawn=0,aim=new THREE.Vector3(1,0,0);const clock=new THREE.Clock();
function meshBox(w,h,d,m,x,y,z,parent=city){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function rng(seed){let x=seed>>>0;return ()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function hexBytes(hex){return (hex.match(/.{1,2}/g)||[]).map(x=>parseInt(x,16))}function safeInt(v){return Number.isInteger(v)&&v>=0&&v<=10000000}
const API='https://blockstream.info/api';
async function getJSON(path){const res=await fetch(API+path);if(!res.ok)throw Error('Bitcoin API HTTP '+res.status);return res.json()}
async function getText(path){const res=await fetch(API+path);if(!res.ok)throw Error('Bitcoin API HTTP '+res.status);return (await res.text()).trim()}
// Contract: adapters must return {height,hash,txids,source,complete}. The game never talks to a provider directly.
const adapters={
 publicApi:{async fetchBlock(height){const hash=await getText('/block-height/'+height);if(!/^[0-9a-f]{64}$/i.test(hash))throw Error('Hash inválido');const b=await getJSON('/block/'+hash);if(!Number.isInteger(b.tx_count)||b.tx_count<1||b.tx_count>10000)throw Error('Conteo de transacciones fuera del límite de 1 a 10000');const txids=[];for(let start=0;start<b.tx_count;start+=25){const page=await getJSON('/block/'+hash+'/txids/'+start);if(!Array.isArray(page)||!page.length)throw Error('Lista incompleta de transacciones');txids.push(...page);if(txids.length>10000)throw Error('Bloque demasiado grande para este prototipo');}if(txids.length!==b.tx_count||new Set(txids).size!==txids.length||txids.some(t=>!/^[0-9a-f]{64}$/i.test(t)))throw Error('Transacciones inválidas, duplicadas o incompletas');return {height,hash,txids,source:'Blockstream Esplora',complete:true}}},
 gateway:{async fetchBlock(_height){throw Error('Gateway no configurado: se requiere endpoint/protocolo documentado')}}
};let adapter=adapters.publicApi;
function derive(data){if(!data.complete||!data.txids.length)throw Error('Datos Bitcoin incompletos');const plots=[];const N=15,cell=6;const occupied=new Set();for(let i=0;i<data.txids.length;i++){const txid=data.txids[i];if(!/^[a-f0-9]{64}$/i.test(txid))throw Error('TXID inválido');const bytes=hexBytes(txid),index=(bytes[0]*256+bytes[1])%(N*N),x=index%N,z=Math.floor(index/N),key=x+','+z;if((x===7&&z===7)||occupied.has(key))continue;occupied.add(key);const height=3+(bytes[2]%11)*1.65;plots.push({x:(x-7)*cell,z:(z-7)*cell,h:height,w:2.5+(bytes[3]%4)*.52,d:2.5+(bytes[4]%4)*.52,tone:bytes[5]%4,txid});}
return {plots,seed:fnv(data.hash),count:data.txids.length,hash:data.hash,height:data.height,source:data.source};}
const palette=[mat(0x36556d),mat(0x436b77),mat(0x566778),mat(0x59697b)],road=mat(0x263842),lane=mat(0xbcae75),cyan=mat(0x2fd9f0,0x0b6478),red=mat(0xff3d50,0x64101a),gold=mat(0xffd76a,0x68561c);
function resetCity(){if(player){scene.remove(player);player=null;}for(const e of enemies)scene.remove(e.o);for(const s of shots){scene.remove(s.o);s.o.geometry.dispose();}while(city.children.length){const o=city.children[0];city.remove(o);o.traverse(v=>{if(v.geometry)v.geometry.dispose()})}enemies.length=0;shots.length=0;walls=[];}
function build(data){resetCity();world=derive(data);const random=rng(world.seed);for(let i=-7;i<=7;i++){meshBox(90,.04,2,road,0,.01,i*6);meshBox(2,.04,90,road,i*6,.012,0)}for(const p of world.plots){meshBox(p.w,p.h,p.d,palette[p.tone],p.x,p.h/2,p.z);meshBox(p.w+.15,.16,p.d+.15,cyan,p.x,p.h+.07,p.z);walls.push({x:p.x,z:p.z,r:Math.max(p.w,p.d)/2+.8});}const pad=meshBox(7,.12,7,mat(0x184f60),0,.04,0);pad.rotation.y=Math.PI/4;player=new THREE.Group();scene.add(player);body=new THREE.Group();player.add(body);makeRobot();player.position.set(0,0,0);vehicle=false;life=100;kills=0;loaded=true;enemySpawn=0;for(let i=0;i<9;i++)spawnEnemy(random);updateHUD();$('banner').textContent='CIUDAD '+world.height+' · '+world.count+' transacciones verificadas · Geometría experimental derivada de TXID';}
function makeRobot(){while(body.children.length){const c=body.children[0];body.remove(c);c.geometry?.dispose()}if(!vehicle){meshBox(2,2.3,1.7,cyan,0,2,0,body);meshBox(1.1,1,1.2,mat(0xc9d8e8),0,3.6,0,body);meshBox(.7,1.8,.8,cyan,-1.3,1.3,0,body);meshBox(.7,1.8,.8,cyan,1.3,1.3,0,body);meshBox(.7,1.4,.8,mat(0x294e65),-.55,.7,0,body);meshBox(.7,1.4,.8,mat(0x294e65),.55,.7,0,body);meshBox(1.5,.45,.55,gold,0,2.1,-1.05,body)}else{meshBox(3.1,.85,4.1,cyan,0,.9,0,body);meshBox(2.2,.65,1.7,mat(0x273f58),0,1.65,-.4,body);meshBox(3.8,.25,1,mat(0xb6e9f4),0,.45,1.4,body);meshBox(3.8,.25,1,mat(0xb6e9f4),0,.45,-1.4,body)}}
function spawnEnemy(random){for(let tries=0;tries<30;tries++){const x=(random()*80-40),z=(random()*80-40);if(Math.hypot(x,z)<14||blocked(x,z,2))continue;const e=new THREE.Group();const orb=new THREE.Mesh(new THREE.OctahedronGeometry(1.2),red);orb.position.y=1.8;e.add(orb);scene.add(e);e.position.set(x,0,z);enemies.push({o:e,hp:3,phase:random()*6});return}}
function blocked(x,z,r=1){if(Math.abs(x)>46||Math.abs(z)>46)return true;return walls.some(w=>Math.abs(x-w.x)<w.r+r&&Math.abs(z-w.z)<w.r+r)}
function updateHUD(){if(!world)return;$('stats').innerHTML=`<b>Bloque:</b> ${world.height} · <b>TX:</b> ${world.count}<br><b>Vida:</b> ${Math.max(0,Math.ceil(life))} / 100 · <b>Drones:</b> ${kills} / 9<br><b>Modo:</b> ${vehicle?'VEHÍCULO':'CAMINANTE'}<br><span class="muted">Fuente: ${world.source}<br>Hash: ${world.hash.slice(0,15)}…</span>`}
function fire(){if(!loaded||shootCD>0||life<=0)return;shootCD=vehicle?.19:.3;const direction=aim.clone().normalize();const b=new THREE.Mesh(new THREE.SphereGeometry(.28,8,6),gold);b.position.copy(player.position).add(new THREE.Vector3(0,1.5,0)).addScaledVector(direction,2);scene.add(b);shots.push({o:b,dir:direction,life:1.5})}
function transform(){if(!loaded||life<=0)return;vehicle=!vehicle;makeRobot();updateHUD()}
$('load').onclick=async()=>{const raw=$('block').value.trim(),match=/^(\d+)(?:\.bitmap)?$/i.exec(raw);if(!match||!safeInt(Number(match[1]))){$('banner').textContent='Introduce un bloque válido, por ejemplo 800000.bitmap';return}const n=Number(match[1]);$('load').disabled=true;$('banner').textContent='Consultando bloque y todas sus transacciones…';try{const data=await adapter.fetchBlock(n);build(data)}catch(e){$('banner').textContent='No se pudo verificar el bloque: '+e.message+'. No se generó una ciudad ficticia.'}finally{$('load').disabled=false}};
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyT'&&!e.repeat)transform();if(e.code==='KeyR'&&!e.repeat&&world){$('load').click()}if(e.code==='Space')fire()});window.addEventListener('keyup',e=>keys.delete(e.code));renderer.domElement.addEventListener('pointermove',e=>{if(!loaded)return;const ndc=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new THREE.Raycaster();ray.setFromCamera(ndc,camera);const point=new THREE.Vector3();if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),point)){const v=point.sub(player.position);v.y=0;if(v.lengthSq()>.1)aim.copy(v.normalize())}});renderer.domElement.addEventListener('pointerdown',fire);
for(const b of document.querySelectorAll('#touch button')){b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.dataset.key)keys.add(b.dataset.key);else if(b.dataset.action==='fire')fire();else transform()});for(const type of ['pointerup','pointercancel','pointerleave'])b.addEventListener(type,()=>{if(b.dataset.key)keys.delete(b.dataset.key)})}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(loaded&&life>0){let dx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),dz=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const len=Math.hypot(dx,dz)||1,spd=(vehicle?19:11)*dt,nx=player.position.x+dx/len*spd,nz=player.position.z+dz/len*spd;if(!blocked(nx,player.position.z,1.3))player.position.x=nx;if(!blocked(player.position.x,nz,1.3))player.position.z=nz;player.rotation.y=Math.atan2(-aim.x,-aim.z);if(keys.has('Space'))fire();shootCD=Math.max(0,shootCD-dt);for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.o.position.addScaledVector(s.dir,35*dt);s.life-=dt;let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(s.o.position.distanceTo(e.o.position.clone().add(new THREE.Vector3(0,1.8,0)))<1.8){e.hp--;hit=true;if(e.hp<=0){scene.remove(e.o);enemies.splice(j,1);kills++;updateHUD()}break}}if(hit||s.life<=0||blocked(s.o.position.x,s.o.position.z,.1)){scene.remove(s.o);s.o.geometry.dispose();shots.splice(i,1)}}for(const e of enemies){const delta=player.position.clone().sub(e.o.position);delta.y=0;const d=delta.length();if(d>2.3&&d<35){delta.normalize();const nx=e.o.position.x+delta.x*dt*2.6,nz=e.o.position.z+delta.z*dt*2.6;if(!blocked(nx,nz,1.1)){e.o.position.x=nx;e.o.position.z=nz}}e.o.children[0].rotation.y+=dt*1.7;if(d<2.5){life-=dt*11;if(life<=0){life=0;$('banner').textContent='MISIÓN FALLIDA · Pulsa R para reiniciar';}updateHUD()}}if(!enemies.length&&kills>=9){$('banner').textContent='MISIÓN COMPLETADA · Ciudad '+world.height+' asegurada · Explora otro bloque';}}if(loaded){const target=player.position.clone().add(new THREE.Vector3(25,35,32));camera.position.lerp(target,Math.min(1,dt*4));camera.lookAt(player.position.x,1,player.position.z)}else{camera.position.set(26,37,37);camera.lookAt(0,0,0)}renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('banner').textContent='Introduce un bloque y pulsa EXPLORAR. Requiere conexión a Internet.';
</script></body></html>
