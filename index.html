meshBox(1.5,.3,.7,dark,0,1.72,0,e);meshBox(.45,.22,1.2,amber,0,2.08,-.2,e);
for(const side of [-1,1]){meshBox(.65,.16,.72,red,side*1.12,1.85,0,e);meshBox(.16,.18,.4,thruster,side*1.18,1.8,.5,e)}scene.add(e);e.position.set(x,0,z);enemies.push({o:e,hp:3,phase:random()*6});return}}
function blocked(x,z,r=1){if(Math.abs(x)>59||Math.abs(z)>59)return true;return walls.some(w=>Math.abs(x-w.x)<w.r+r&&Math.abs(z-w.z)<w.r+r)}
function updateHUD(){if(!world)return;$('stats').innerHTML=`<b>Bloque:</b> ${world.height} · <b>TX:</b> ${world.count}<br><b>Vida:</b> ${Math.max(0,Math.ceil(life))} / 100 · <b>Drones:</b> ${kills} / 9<br><b>Modo:</b> ${vehicle?'VEHÍCULO':'CAMINANTE'}<br><span class="muted">Fuente: ${world.source}<br>Hash: ${world.hash.slice(0,15)}…</span>`}
function fire(){if(!loaded||shootCD>0||life<=0)return;shootCD=vehicle?.19:.3;// Shoot along the character's local forward (-Z), matching its visible heading.
const direction=new THREE.Vector3(-Math.sin(player.rotation.y),0,-Math.cos(player.rotation.y)).normalize();const b=new THREE.Mesh(new THREE.OctahedronGeometry(.36,0),gold);b.position.copy(player.position).add(new THREE.Vector3(0,1.5,0)).addScaledVector(direction,2);scene.add(b);shots.push({o:b,dir:direction,life:1.5})}
$('transform').onclick=()=>transform();
function transform(){if(!loaded||life<=0)return;vehicle=!vehicle;makeRobot();updateHUD()}
$('demo').onclick=()=>{const height=800000;const hash='0'.repeat(63)+'1';const txids=Array.from({length:360},(_,i)=>{const x=fnv('demo:'+i+':bitmap-cop');return (x.toString(16).padStart(8,'0').repeat(8));});build({height,hash,txids,source:'DEMO SINTÉTICA · SIN DATOS BITCOIN',complete:true});$('banner').textContent='DEMO SIN RED · Geometría sintética, NO Bitcoin auténtico';};
$('load').onclick=async()=>{const raw=$('block').value.trim(),match=/^(\d+)(?:\.bitmap)?$/i.exec(raw);if(!match||!safeInt(Number(match[1]))){$('banner').textContent='Introduce un bloque válido, por ejemplo 800000.bitmap';return}const n=Number(match[1]);$('load').disabled=true;$('banner').textContent='Consultando bloque y todas sus transacciones…';try{const data=await adapter.fetchBlock(n);build(data)}catch(e){$('banner').textContent='No se pudo verificar el bloque: '+e.message+'. No se generó una ciudad ficticia.'}finally{$('load').disabled=false}};
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyT'&&!e.repeat)transform();if(e.code==='KeyR'&&!e.repeat&&world){if(world.source.startsWith('DEMO'))$('demo').click();else $('load').click()}if(e.code==='Space')fire()});window.addEventListener('keyup',e=>keys.delete(e.code));renderer.domElement.addEventListener('pointermove',e=>{if(!loaded)return;const ndc=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new THREE.Raycaster();ray.setFromCamera(ndc,camera);const point=new THREE.Vector3();if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),point)){const v=point.sub(player.position);v.y=0;if(v.lengthSq()>.1)aim.copy(v.normalize())}});renderer.domElement.addEventListener('pointerdown',fire);
for(const b of document.querySelectorAll('#touch button')){b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.dataset.key)keys.add(b.dataset.key);else if(b.dataset.action==='fire')fire();else transform()});for(const type of ['pointerup','pointercancel','pointerleave'])b.addEventListener(type,()=>{if(b.dataset.key)keys.delete(b.dataset.key)})}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(loaded&&life>0){let dx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),dz=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const len=Math.hypot(dx,dz)||1,spd=(vehicle?19:11)*dt,nx=player.position.x+dx/len*spd,nz=player.position.z+dz/len*spd;if(!blocked(nx,player.position.z,1.3))player.position.x=nx;if(!blocked(player.position.x,nz,1.3))player.position.z=nz;// Heading follows movement, not the mouse. Smooth shortest-arc rotation.
if(dx||dz){const desired=Math.atan2(-dx,-dz);let diff=Math.atan2(Math.sin(desired-travelHeading),Math.cos(desired-travelHeading));travelHeading+=Math.max(-dt*10,Math.min(dt*10,diff));}
player.rotation.y=travelHeading;
if(!vehicle){walkPhase+=(dx||dz)?dt*10:dt*3;for(let i=0;i<legs.length;i++)legs[i].rotation.x=(dx||dz)?Math.sin(walkPhase+i*Math.PI)*.36:0;}
else{for(const t of thrusters)t.scale.setScalar(1+.16*Math.sin(performance.now()*.015));}if(keys.has('Space'))fire();shootCD=Math.max(0,shootCD-dt);for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.o.position.addScaledVector(s.dir,35*dt);s.life-=dt;let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(s.o.position.distanceTo(e.o.position.clone().add(new THREE.Vector3(0,1.8,0)))<1.8){e.hp--;hit=true;if(e.hp<=0){scene.remove(e.o);enemies.splice(j,1);kills++;updateHUD()}break}}if(hit||s.life<=0||blocked(s.o.position.x,s.o.position.z,.1)){scene.remove(s.o);s.o.geometry.dispose();shots.splice(i,1)}}for(const e of enemies){const delta=player.position.clone().sub(e.o.position);delta.y=0;const d=delta.length();if(d>2.3&&d<35){delta.normalize();const nx=e.o.position.x+delta.x*dt*2.6,nz=e.o.position.z+delta.z*dt*2.6;if(!blocked(nx,nz,1.1)){e.o.position.x=nx;e.o.position.z=nz}}e.o.children[0].rotation.y+=dt*1.7;if(d<2.5){life-=dt*6;if(life<=0){life=0;$('banner').textContent='MISIÓN FALLIDA · Pulsa R para reiniciar';}updateHUD()}}if(!enemies.length&&kills>=9){$('banner').textContent='MISIÓN COMPLETADA · Ciudad '+world.height+' asegurada · Explora otro bloque';}}if(loaded){const target=player.position.clone().add(new THREE.Vector3(18,23,24));camera.position.lerp(target,Math.min(1,dt*4));camera.lookAt(player.position.x,1,player.position.z)}else{camera.position.set(26,37,37);camera.lookAt(0,0,0)}renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('banner').textContent='Motor 3D listo. Pulsa EXPLORAR para cargar datos Bitcoin.';$('stats').textContent='Motor listo · EXPLORAR para Bitcoin real o DEMO SIN RED para probar controles';
</script></body></html>
